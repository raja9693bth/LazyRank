name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lazyproof_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (typecheck)
        run: npm run lint

      - name: Run test suite against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/lazyproof_test
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/lazyproof_test
          CI: "true"
          STRICT_PG_TEST: "true"
        run: npm test

      - name: Build frontend and server
        run: npm run build
